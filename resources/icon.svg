<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kaayi app icon: a gold tile on Onyx black, with a balance line falling
       to a dot: the path to debt-free, as in the app's main chart. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a1e25"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d496"/>
      <stop offset="55%" stop-color="#e3bb6f"/>
      <stop offset="100%" stop-color="#b98c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#e3bb6f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#e3bb6f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="112" y="152" width="800" height="800" fill="url(#glow)"/>
  <rect x="232" y="232" width="560" height="560" rx="140" fill="url(#gold)"/>
  <path d="M338 372 C 418 372, 452 470, 512 540 S 612 640, 668 646" fill="none" stroke="#1a1407" stroke-width="46" stroke-linecap="round"/>
  <circle cx="686" cy="646" r="38" fill="#1a1407"/>
</svg>
